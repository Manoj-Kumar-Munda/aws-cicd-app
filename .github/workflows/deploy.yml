name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Install Node.js if not present
            if ! command -v node &> /dev/null; then
              curl -fsSL https://rpm.nodesource.com/setup_22.x | sudo bash - 2>/dev/null || \
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo yum install -y nodejs 2>/dev/null || sudo apt-get install -y nodejs
            fi

            # Install Git if not present
            if ! command -v git &> /dev/null; then
              sudo yum install -y git 2>/dev/null || sudo apt-get install -y git
            fi

            APP_DIR=~/aws-cicd-app

            # Clone or pull latest code
            if [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              git pull origin main
            else
              git clone ${{ secrets.REPO_URL }} "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Install production dependencies
            npm ci --omit=dev

            # Install pm2 globally if not present
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Start or restart the app using ecosystem config
            pm2 startOrRestart ecosystem.config.cjs --env production
            pm2 save
